[project]
name = "compareqp"
version = "0.1.0"
description = "The goal of this project is to compare different QP free solvers, with a 'home-made' one, IPquadprog (Merothra style)."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "clarabel>=0.11.1",
    "cvxopt>=1.3.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osqp>=1.1.3",
    "pandas>=3.0.6",
    "quadprog>=0.1.13",
    "scipy>=1.18.1",
]

[project.scripts]
compareqp = "compareqp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
